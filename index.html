<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>EventHub — seats, waitlists, and who gets in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
/* ============================================================
   EventHub — design tokens
   The palette is semantic, not decorative: every colour names a
   seat state, because seat state is what this product is about.
   ============================================================ */
:root{
  --bg:#E6EAF2; --bg-deep:#D7DDE9; --surface:#FFFFFF; --surface-2:#F3F6FB;
  --ink:#131A2D; --ink-2:#39435E; --muted:#6C7690; --line:#C9D1E1; --hair:#E3E8F1;
  --taken:#2E3C74; --taken-edge:#1B2450; --taken-soft:#E5E8F5;
  --free:#0C9B84; --free-soft:#DCF2ED;
  --wait:#BF6316; --wait-soft:#FBEADB;
  --stop:#B2304B; --stop-soft:#FAE3E8;
  --floor:#CFD7E6; --floor-edge:#AFBACE;
  --shadow-1:0 1px 2px rgba(19,26,45,.07), 0 10px 26px -14px rgba(19,26,45,.28);
  --shadow-2:0 2px 4px rgba(19,26,45,.06), 0 30px 60px -26px rgba(27,36,80,.42);
  --glow:rgba(46,60,116,.18);
  --radius-lg:22px; --radius:14px; --radius-sm:9px;
  --ease:cubic-bezier(.22,.68,.32,1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1121; --bg-deep:#070B16; --surface:#131A2E; --surface-2:#182036;
    --ink:#E9EDF8; --ink-2:#BAC4DC; --muted:#8792B0; --line:#26304D; --hair:#1D2540;
    --taken:#8090FF; --taken-edge:#3E4CAE; --taken-soft:#1B2447;
    --free:#2BD3B0; --free-soft:#10302C;
    --wait:#F0A54A; --wait-soft:#33240F;
    --stop:#FF7089; --stop-soft:#361420;
    --floor:#1C2540; --floor-edge:#121935;
    --shadow-1:0 1px 2px rgba(0,0,0,.4), 0 12px 30px -16px rgba(0,0,0,.8);
    --shadow-2:0 2px 6px rgba(0,0,0,.45), 0 40px 70px -30px rgba(0,0,0,.9);
    --glow:rgba(128,144,255,.22);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1121; --bg-deep:#070B16; --surface:#131A2E; --surface-2:#182036;
  --ink:#E9EDF8; --ink-2:#BAC4DC; --muted:#8792B0; --line:#26304D; --hair:#1D2540;
  --taken:#8090FF; --taken-edge:#3E4CAE; --taken-soft:#1B2447;
  --free:#2BD3B0; --free-soft:#10302C;
  --wait:#F0A54A; --wait-soft:#33240F;
  --stop:#FF7089; --stop-soft:#361420;
  --floor:#1C2540; --floor-edge:#121935;
  --shadow-1:0 1px 2px rgba(0,0,0,.4), 0 12px 30px -16px rgba(0,0,0,.8);
  --shadow-2:0 2px 6px rgba(0,0,0,.45), 0 40px 70px -30px rgba(0,0,0,.9);
  --glow:rgba(128,144,255,.22);
  color-scheme: dark;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:15.5px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
h1,h2,h3,h4{font-family:"Bricolage Grotesque","Instrument Sans",sans-serif;margin:0;font-weight:700;letter-spacing:-.022em;line-height:1.04}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
a{color:inherit}
:focus-visible{outline:2.5px solid var(--taken);outline-offset:3px;border-radius:5px}
::selection{background:var(--taken);color:var(--surface)}

#root{min-height:100vh;display:flex;flex-direction:column}
.foot{margin-top:auto}
.wrap{max-width:1220px;margin:0 auto;padding:0 28px}
@media(max-width:700px){.wrap{padding:0 18px}}

/* ---------- header ---------- */
.hdr{position:sticky;top:0;z-index:60;backdrop-filter:blur(18px) saturate(1.5);
  background:color-mix(in srgb, var(--bg) 82%, transparent);
  border-bottom:1px solid var(--hair)}
.hdr-in{display:flex;align-items:center;gap:22px;height:66px}
.brand{display:flex;align-items:center;gap:11px;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:19px;letter-spacing:-.03em}
.mark{width:26px;height:26px;position:relative;flex:none}
.mark i{position:absolute;display:block;width:10px;height:10px;border-radius:2.5px;background:var(--taken);
  box-shadow:0 2px 0 var(--taken-edge)}
.mark i:nth-child(1){left:0;top:2px}
.mark i:nth-child(2){left:13px;top:2px;background:var(--free);box-shadow:0 2px 0 color-mix(in srgb,var(--free) 60%, #000)}
.mark i:nth-child(3){left:6.5px;top:14px}
.nav{display:flex;gap:4px;margin-left:8px}
.nav button{padding:7px 13px;border-radius:9px;color:var(--ink-2);font-weight:500;font-size:14.5px;transition:background .18s var(--ease),color .18s}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button[aria-current="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-1);font-weight:600}
.spacer{flex:1}
.icon-btn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;border:1px solid var(--line);
  background:var(--surface);color:var(--ink-2);transition:transform .18s var(--ease), color .18s}
.icon-btn:hover{color:var(--ink);transform:translateY(-1px)}
.who{display:flex;align-items:center;gap:9px;padding:5px 5px 5px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.who small{color:var(--muted);font-size:12.5px;display:block;line-height:1.1}
.who b{font-size:13.5px;font-weight:600;display:block;line-height:1.25}
.avatar{width:29px;height:29px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;
  background:var(--taken);color:#fff;flex:none}
:root[data-theme="dark"] .avatar, :root:not([data-theme="light"]) .avatar{color:#0C1121}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .avatar{color:#fff}}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 17px;border-radius:11px;
  font-weight:600;font-size:14.5px;border:1px solid transparent;transition:transform .16s var(--ease), box-shadow .2s, background .2s;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--taken);color:var(--surface);box-shadow:0 3px 0 var(--taken-edge), 0 14px 24px -14px var(--glow)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 4px 0 var(--taken-edge), 0 20px 30px -16px var(--glow)}
.btn-primary:active{box-shadow:0 1px 0 var(--taken-edge)}
:root[data-theme="dark"] .btn-primary{color:#0B0F1E}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn-primary{color:#0B0F1E}}
.btn-wait{background:var(--wait);color:#fff;box-shadow:0 3px 0 color-mix(in srgb,var(--wait) 65%,#000)}
:root[data-theme="dark"] .btn-wait{color:#251505}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn-wait{color:#251505}}
.btn-ghost{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn-ghost:hover{background:var(--surface-2)}
.btn-quiet{color:var(--muted);padding:8px 12px}
.btn-quiet:hover{color:var(--ink);background:var(--surface-2)}
.btn-danger{background:var(--stop-soft);color:var(--stop);border-color:color-mix(in srgb,var(--stop) 30%, transparent)}
.btn-danger:hover{background:color-mix(in srgb,var(--stop) 16%, transparent)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn-sm{padding:7px 12px;font-size:13.5px;border-radius:9px}
.btn-lg{padding:14px 24px;font-size:16px;border-radius:13px}

/* ---------- hero ---------- */
.hero{position:relative;padding:74px 0 54px;overflow:hidden}
.hero:before{content:"";position:absolute;inset:-40% -20% auto -20%;height:120%;
  background:radial-gradient(60% 55% at 72% 34%, var(--glow), transparent 70%);pointer-events:none}
.hero-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.02fr);gap:44px;align-items:center;position:relative}
.kicker{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink-2);
  background:var(--surface);border:1px solid var(--line);padding:6px 13px 6px 9px;border-radius:999px;box-shadow:var(--shadow-1)}
.kicker .dot{width:7px;height:7px;border-radius:50%;background:var(--free);box-shadow:0 0 0 4px var(--free-soft)}
h1.display{font-size:clamp(40px,6.1vw,74px);font-weight:800;letter-spacing:-.04em;margin:20px 0 0}
h1.display .thin{font-weight:400;font-style:normal;color:var(--ink-2)}
.lede{margin-top:20px;font-size:17.5px;color:var(--ink-2);max-width:46ch;line-height:1.55}
.hero-cta{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap}
.hero-stats{display:flex;gap:30px;margin-top:38px;padding-top:26px;border-top:1px solid var(--line)}
.stat b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:29px;font-weight:700;letter-spacing:-.03em;line-height:1}
.stat span{font-size:13.5px;color:var(--muted)}
@media(max-width:900px){.hero-grid{grid-template-columns:1fr;gap:34px}.hero{padding:44px 0 34px}}

/* ---------- the seat block (3D) ---------- */
.stage{perspective:1500px;perspective-origin:50% 42%;display:grid;place-items:center;min-height:380px;touch-action:pan-y}
.block-rot{transform-style:preserve-3d;transition:transform .45s var(--ease);will-change:transform}
.floor{position:relative;transform-style:preserve-3d;padding:22px;border-radius:12px;
  background:linear-gradient(180deg,var(--floor),color-mix(in srgb,var(--floor) 80%, var(--floor-edge)));
  box-shadow:0 10px 0 var(--floor-edge), 0 40px 60px -22px rgba(19,26,45,.42);}
.seats{display:grid;gap:6px}
.seat{width:var(--sz);height:var(--sz);border-radius:3.5px;background:var(--taken-soft);
  box-shadow:0 1.5px 0 var(--floor-edge);
  transition:box-shadow .3s var(--ease), background .3s, transform .3s var(--ease);}
.seat.free{background:var(--surface);box-shadow:0 1.5px 0 var(--floor-edge)}
.seat.taken{background:var(--taken);box-shadow:0 2px 0 var(--taken-edge),0 4px 0 var(--taken-edge),0 6px 0 var(--taken-edge),0 7px 5px rgba(19,26,45,.3);
  transform:translateZ(7px)}
.seat.you{background:var(--free);box-shadow:0 2px 0 color-mix(in srgb,var(--free) 55%,#000),0 4px 0 color-mix(in srgb,var(--free) 55%,#000),0 6px 0 color-mix(in srgb,var(--free) 55%,#000),0 8px 14px color-mix(in srgb,var(--free) 45%, transparent);
  transform:translateZ(11px)}
.seat.dead{background:var(--floor-edge);opacity:.5;box-shadow:none;transform:none}
.seat.rise{animation:rise .5s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateZ(46px) scale(.6)}to{opacity:1}}
.queue-line{display:flex;flex-direction:column;gap:7px;margin-left:20px;padding-top:6px;transform-style:preserve-3d}
.pin{width:10px;height:10px;border-radius:50%;background:var(--wait);transform:translateZ(16px);
  box-shadow:0 2px 0 color-mix(in srgb,var(--wait) 55%,#000),0 4px 0 color-mix(in srgb,var(--wait) 55%,#000),
             0 6px 0 color-mix(in srgb,var(--wait) 55%,#000),0 9px 8px rgba(19,26,45,.3)}
.pin.rise{animation:rise .5s var(--ease) both}
.stage-legend{display:flex;gap:18px;justify-content:center;margin-top:26px;flex-wrap:wrap}
.lg{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted)}
.lg i{width:11px;height:11px;border-radius:3px;display:block}
.lg i.t{background:var(--taken);box-shadow:0 2px 0 var(--taken-edge)}
.lg i.f{background:var(--surface);border:1px solid var(--line)}
.lg i.w{background:var(--wait);border-radius:50%}

/* ---------- filters ---------- */
.browse{display:grid;grid-template-columns:262px minmax(0,1fr);gap:30px;padding:34px 0 80px;align-items:start}
@media(max-width:940px){.browse{grid-template-columns:1fr}}
.rail{position:sticky;top:86px;background:var(--surface);border:1px solid var(--hair);border-radius:var(--radius-lg);
  padding:20px;box-shadow:var(--shadow-1)}
@media(max-width:940px){.rail{position:static}}
.rail h4{font-size:15px;margin-bottom:14px}
.field{margin-bottom:15px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:500}
.input, select.input, textarea.input{width:100%;padding:9px 12px;border-radius:10px;border:1px solid var(--line);
  background:var(--surface-2);transition:border-color .18s, background .18s;font-size:14.5px}
.input:focus{border-color:var(--taken);background:var(--surface);outline:none;box-shadow:0 0 0 3px var(--glow)}
textarea.input{resize:vertical;min-height:84px;line-height:1.5}
.toggle{display:flex;align-items:center;gap:10px;padding:8px 0;cursor:pointer;font-size:14.5px}
.toggle input{position:absolute;opacity:0;width:0;height:0}
.tog{width:38px;height:22px;border-radius:999px;background:var(--line);position:relative;transition:background .2s var(--ease);flex:none}
.tog:after{content:"";position:absolute;top:2.5px;left:2.5px;width:17px;height:17px;border-radius:50%;background:var(--surface);
  box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .22s var(--ease)}
.toggle input:checked + .tog{background:var(--free)}
.toggle input:checked + .tog:after{transform:translateX(16px)}
.toggle input:focus-visible + .tog{outline:2.5px solid var(--taken);outline-offset:3px}

/* ---------- event cards ---------- */
.results-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.results-head h2{font-size:23px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px;align-items:stretch}
.cards > div{display:flex}
.card{position:relative;background:var(--surface);border:1px solid var(--hair);border-radius:var(--radius-lg);padding:20px;
  text-align:left;box-shadow:var(--shadow-1);transform-style:preserve-3d;transition:box-shadow .3s var(--ease), border-color .2s;
  display:flex;flex-direction:column;gap:13px;width:100%}
.card:hover{box-shadow:var(--shadow-2);border-color:var(--line)}
.card .lift{transform:translateZ(26px);transform-style:preserve-3d}
.card-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.card h3{font-size:18px;letter-spacing:-.025em;text-wrap:balance}
.when{font-size:13.5px;color:var(--muted);margin-top:5px}
.where{font-size:13.5px;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.chip{font-size:12px;font-weight:600;padding:4px 9px;border-radius:7px;white-space:nowrap;border:1px solid transparent}
.chip.ok{background:var(--free-soft);color:var(--free)}
.chip.full{background:var(--wait-soft);color:var(--wait)}
.chip.off{background:var(--stop-soft);color:var(--stop)}
.chip.done{background:var(--surface-2);color:var(--muted);border-color:var(--hair)}
.occ{display:flex;gap:2.5px;align-items:flex-end;height:26px;margin-top:2px}
.occ i{flex:1;border-radius:2px;background:var(--hair);height:9px;transition:height .3s var(--ease), background .3s}
.occ i.on{background:var(--taken);height:22px}
.occ i.q{background:var(--wait);height:13px;border-radius:2px}
.occ .spill{width:1px;height:24px;background:var(--line);margin:0 4px;flex:none;align-self:flex-end}
.card-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:auto;padding-top:4px}
.seats-left{font-size:13.5px;color:var(--ink-2)}
.seats-left b{font-family:"Bricolage Grotesque",sans-serif;font-size:17px;letter-spacing:-.02em}
.byline{font-size:13px;color:var(--muted)}

/* ---------- drawer / modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,14,26,.5);backdrop-filter:blur(3px);z-index:90;
  animation:fade .25s var(--ease)}
@keyframes fade{from{opacity:0}}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(600px,100%);background:var(--bg);z-index:91;overflow-y:auto;
  box-shadow:var(--shadow-2);animation:slide .38s var(--ease);border-left:1px solid var(--hair)}
@keyframes slide{from{transform:translateX(38px);opacity:.4}}
.drawer-in{padding:26px 30px 60px}
@media(max-width:600px){.drawer-in{padding:20px 18px 50px}}
.drawer-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:18px}
.modal{position:fixed;z-index:91;top:50%;left:50%;transform:translate(-50%,-50%);width:min(470px,calc(100% - 32px));
  background:var(--surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-2);padding:28px;max-height:90vh;overflow-y:auto;
  animation:pop .3s var(--ease);border:1px solid var(--hair)}
@keyframes pop{from{transform:translate(-50%,-46%) scale(.96);opacity:0}}
.panel{background:var(--surface);border:1px solid var(--hair);border-radius:var(--radius-lg);padding:20px;box-shadow:var(--shadow-1)}
.panel + .panel{margin-top:16px}

/* ---------- lists / rows ---------- */
.row{display:flex;align-items:center;gap:13px;padding:13px 0;border-bottom:1px solid var(--hair)}
.row:last-child{border-bottom:none}
.row .grow{flex:1;min-width:0}
.row b{display:block;font-size:15px;font-weight:600}
.row small{color:var(--muted);font-size:13px}
.pos{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;font-family:"Bricolage Grotesque",sans-serif;
  font-weight:700;font-size:14px;background:var(--wait-soft);color:var(--wait);flex:none}
.pos.conf{background:var(--free-soft);color:var(--free)}
.empty{text-align:center;padding:46px 22px;border:1.5px dashed var(--line);border-radius:var(--radius-lg);color:var(--muted)}
.empty h3{color:var(--ink);font-size:19px;margin-bottom:8px}

/* ---------- wire log ---------- */
.wire{position:fixed;right:0;bottom:0;top:0;width:min(430px,100%);background:var(--surface);z-index:92;
  border-left:1px solid var(--line);display:flex;flex-direction:column;box-shadow:var(--shadow-2);animation:slide .3s var(--ease)}
.wire-head{padding:16px 18px;border-bottom:1px solid var(--hair);display:flex;align-items:center;gap:10px}
.wire-list{overflow-y:auto;padding:8px 0;flex:1}
.wl{padding:9px 18px;border-bottom:1px solid var(--hair);display:flex;gap:10px;align-items:baseline;font-size:13px}
.verb{font-weight:700;font-size:11.5px;padding:2px 6px;border-radius:5px;flex:none;letter-spacing:.01em}
.verb.GET{background:var(--taken-soft);color:var(--taken)}
.verb.POST{background:var(--free-soft);color:var(--free)}
.verb.PUT{background:var(--wait-soft);color:var(--wait)}
.verb.DELETE{background:var(--stop-soft);color:var(--stop)}
.wl .path{flex:1;word-break:break-all;color:var(--ink-2);font-size:12.5px}
.wl .code{font-weight:700;font-size:12.5px}
.code.g{color:var(--free)} .code.r{color:var(--stop)}

/* ---------- toasts ---------- */
.toasts{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:120;display:flex;flex-direction:column;gap:9px;
  align-items:center;width:min(430px,calc(100% - 28px))}
.toast{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--taken);border-radius:12px;
  padding:12px 16px;box-shadow:var(--shadow-2);display:flex;gap:11px;align-items:flex-start;width:100%;
  animation:toastin .32s var(--ease)}
@keyframes toastin{from{transform:translateY(14px);opacity:0}}
.toast.good{border-left-color:var(--free)} .toast.bad{border-left-color:var(--stop)} .toast.warn{border-left-color:var(--wait)}
.toast b{font-size:14.5px;display:block}
.toast span{font-size:13.5px;color:var(--ink-2)}

/* ---------- misc ---------- */
.tabs{display:flex;gap:3px;background:var(--surface-2);padding:4px;border-radius:12px;border:1px solid var(--hair)}
.tabs button{flex:1;padding:8px 12px;border-radius:9px;font-size:14px;font-weight:500;color:var(--muted);transition:.18s var(--ease)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--shadow-1)}
.demo-chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.demo-chip{border:1px solid var(--line);background:var(--surface-2);padding:6px 11px;border-radius:9px;font-size:13px;
  transition:.18s var(--ease)}
.demo-chip:hover{border-color:var(--taken);background:var(--surface);transform:translateY(-1px)}
.err{background:var(--stop-soft);color:var(--stop);padding:10px 13px;border-radius:10px;font-size:13.5px;margin-bottom:14px}
.spin{width:15px;height:15px;border-radius:50%;border:2px solid color-mix(in srgb,currentColor 30%,transparent);

<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.4/babel.min.js"></script>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useMemo, useCallback } = React;

/* ============================================================
   api.js — a faithful in-browser replica of the Spring Boot API.
   Same paths, same status codes, same RFC 9457 problem bodies,
   same booking rules (BookingService.java) so the UI you see here
   is the UI that runs against the real server unchanged.
   Swap `api` for `httpApi(baseUrl)` in the Vite build to go live.
   ============================================================ */

const DAY = 86400000;
/* Seeded events land on a believable hour rather than whatever time the page
   happened to load, so the list reads like a real calendar. */
function at(daysOut, hour, minute) {
  const d = new Date(Date.now() + daysOut * DAY);
  d.setHours(hour, minute, 0, 0);
  return d.getTime();
}
const PASSWORD = "password123";

function freshDb() {
  const now = Date.now();
  const users = [
    { id: 1, name: "Ada Organizer",  email: "ada@eventhub.dev",   role: "ORGANIZER" },
    { id: 2, name: "Kofi Organizer", email: "kofi@eventhub.dev",  role: "ORGANIZER" },
    { id: 3, name: "Grace Attendee", email: "grace@eventhub.dev", role: "ATTENDEE" },
    { id: 4, name: "Linus Attendee", email: "linus@eventhub.dev", role: "ATTENDEE" },
    { id: 5, name: "Meron Attendee", email: "meron@eventhub.dev", role: "ATTENDEE" },
    { id: 6, name: "Yusuf Attendee", email: "yusuf@eventhub.dev", role: "ATTENDEE" },
  ];
  const events = [
    { id: 1, organizerId: 1, title: "Spring Boot Deep Dive",
      description: "Transactions, locking and everything that bites in production. We take one oversold booking table and fix it live: pessimistic locks, unique partial indexes, and the check constraint that catches what your service layer misses.",
      venue: "Innovation Hub, Addis Ababa", startTime: at(14, 18, 30), capacity: 2, bookedCount: 2, status: "SCHEDULED" },
    { id: 2, organizerId: 1, title: "Intro to Distributed Systems",
      description: "Consensus, partitions and why your clock is lying to you. Three hours on the failure modes that only show up once you have a second machine.",
      venue: "Riverside Auditorium", startTime: at(30, 9, 0), capacity: 100, bookedCount: 41, status: "SCHEDULED" },
    { id: 3, organizerId: 2, title: "Weekend Kotlin Workshop",
      description: "Hands-on, bring a laptop. Coroutines, null safety and interop with the Java you already have in production.",
      venue: "Maker Space, Bole", startTime: at(21, 10, 0), capacity: 25, bookedCount: 19, status: "SCHEDULED" },
    { id: 4, organizerId: 2, title: "Postgres for People Who Ship",
      description: "Indexes that earn their keep, EXPLAIN without fear, and the three settings worth changing on day one.",
      venue: "Lideta Tech Park", startTime: at(6, 17, 0), capacity: 40, bookedCount: 40, status: "SCHEDULED" },
    { id: 5, organizerId: 1, title: "Design Systems in the Open",
      description: "Tokens, themes and how to keep a component library from rotting once four teams depend on it.",
      venue: "Innovation Hub, Addis Ababa", startTime: at(45, 14, 30), capacity: 60, bookedCount: 7, status: "SCHEDULED" },
    { id: 6, organizerId: 2, title: "CI/CD Night: Pipelines That Don't Lie",
      description: "Cancelled while the venue sorts out power. Watch this space for the new date.",
      venue: "Kazanchis Loft", startTime: at(9, 19, 0), capacity: 35, bookedCount: 0, status: "CANCELLED" },
  ];
  // Event 1 is full with two people queued, exactly like DemoDataSeeder.
  const bookings = [
    { id: 1, userId: 3, eventId: 1, status: "CONFIRMED",   bookedAt: now - 5 * DAY },
    { id: 2, userId: 4, eventId: 1, status: "CONFIRMED",   bookedAt: now - 4 * DAY },
    { id: 3, userId: 5, eventId: 1, status: "WAITLISTED",  bookedAt: now - 3 * DAY },
    { id: 4, userId: 6, eventId: 1, status: "WAITLISTED",  bookedAt: now - 2 * DAY },
    { id: 5, userId: 3, eventId: 2, status: "CONFIRMED",   bookedAt: now - 6 * DAY },
    { id: 6, userId: 4, eventId: 4, status: "CONFIRMED",   bookedAt: now - 7 * DAY },
    { id: 7, userId: 5, eventId: 4, status: "WAITLISTED",  bookedAt: now - 1 * DAY },
  ];
  return { users, events, bookings, seq: { user: 7, event: 7, booking: 8 } };
}

const STORE_KEY = "eventhub.db.v1";
const SESSION_KEY = "eventhub.session.v1";

function loadDb() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) { /* storage unavailable: run from memory */ }
  return freshDb();
}
let db = loadDb();
function saveDb() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(db)); } catch (e) {}
}
function resetDb() { db = freshDb(); saveDb(); }

/* --- RFC 9457 problem details, same shape as GlobalExceptionHandler --- */
class Problem extends Error {
  constructor(status, type, title, detail) {
    super(detail);
    this.status = status; this.type = "https://eventhub.dev/problems/" + type;
    this.title = title; this.detail = detail;
  }
}
const notFound  = (d) => new Problem(404, "not-found", "Resource not found", d);
const conflict  = (d) => new Problem(409, "conflict", "Conflicting request", d);
const badReq    = (d) => new Problem(400, "invalid-request", "Invalid request", d);
const forbidden = (d) => new Problem(403, "forbidden", "Forbidden", d);
const unauth    = (d) => new Problem(401, "unauthenticated", "Authentication failed", d);

/* --- wire log: every call the UI makes, as the server would see it --- */
const wire = { entries: [], listeners: new Set() };
function logWire(method, path, status, ms) {
  wire.entries = [{ id: Math.random().toString(36).slice(2), method, path, status, ms,
                    at: new Date().toLocaleTimeString([], { hour12: false }) }, ...wire.entries].slice(0, 60);
  wire.listeners.forEach((fn) => fn());
}

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

function userOf(email) { return db.users.find((u) => u.email.toLowerCase() === String(email).toLowerCase()); }
function eventOf(id) { return db.events.find((e) => e.id === Number(id)); }
function activeBooking(userId, eventId) {
  return db.bookings.find((b) => b.userId === userId && b.eventId === Number(eventId) &&
    (b.status === "CONFIRMED" || b.status === "WAITLISTED"));
}
function waitlistPosition(b) {
  if (b.status !== "WAITLISTED") return null;
  const queue = db.bookings.filter((x) => x.eventId === b.eventId && x.status === "WAITLISTED")
    .sort((x, y) => x.bookedAt - y.bookedAt);
  return queue.findIndex((x) => x.id === b.id) + 1;
}
function seatsRemaining(e) { return Math.max(0, e.capacity - e.bookedCount); }
function toEventResponse(e) {
  const org = db.users.find((u) => u.id === e.organizerId);
  return {
    id: e.id, title: e.title, description: e.description,
    organizerName: org ? org.name : "Unknown", venue: e.venue,
    startTime: new Date(e.startTime).toISOString(),
    capacity: e.capacity, bookedCount: e.bookedCount,
    seatsRemaining: seatsRemaining(e), status: e.status,
    bookable: e.status === "SCHEDULED" && e.startTime > Date.now() && seatsRemaining(e) > 0,
  };
}
function toBookingResponse(b) {
  const e = eventOf(b.eventId), u = db.users.find((x) => x.id === b.userId);
  return {
    id: b.id, eventId: b.eventId, eventTitle: e ? e.title : "",
    attendeeName: u ? u.name : "", attendeeEmail: u ? u.email : "",
    status: b.status, bookedAt: new Date(b.bookedAt).toISOString(),
    waitlistPosition: waitlistPosition(b),
  };
}
function tokenFor(email) { return "demo." + btoa(email + ":" + Date.now()).replace(/=/g, ""); }
function requireUser(session) {
  if (!session || !session.email) throw unauth("Credentials are missing, invalid or expired");
  const u = userOf(session.email);
  if (!u) throw unauth("Credentials are missing, invalid or expired");
  return u;
}

/* --- the endpoints --- */
async function call(method, path, fn) {
  const started = performance.now();
  await sleep(140 + Math.random() * 180);
  try {
    const out = await fn();
    logWire(method, "/api/v1" + path, out && out.__status ? out.__status : (method === "POST" ? 201 : method === "DELETE" ? 204 : 200),
            Math.round(performance.now() - started));
    return out && out.__status ? out.body : out;
  } catch (err) {
    logWire(method, "/api/v1" + path, err.status || 500, Math.round(performance.now() - started));
    throw err;
  }
}

const api = {
  mode: "demo",

  register: (body) => call("POST", "/auth/register", () => {
    if (!body.name || !body.email) throw badReq("One or more fields are invalid");
    if (String(body.password || "").length < 8) throw badReq("Password must be at least 8 characters");
    if (userOf(body.email)) throw conflict("That email is already registered");
    const u = { id: ++db.seq.user, name: body.name, email: body.email, role: body.role };
    db.users.push(u); saveDb();
    return { accessToken: tokenFor(u.email), refreshToken: tokenFor(u.email), tokenType: "Bearer",
             expiresInSeconds: 900, email: u.email, role: u.role };
  }),

  login: (body) => call("POST", "/auth/login", () => {
    const u = userOf(body.email);
    if (!u || body.password !== PASSWORD) throw unauth("Credentials are missing, invalid or expired");
    return { accessToken: tokenFor(u.email), refreshToken: tokenFor(u.email), tokenType: "Bearer",
             expiresInSeconds: 900, email: u.email, role: u.role };
  }),

  logout: (session) => call("POST", "/auth/logout", () => { requireUser(session); return { __status: 204, body: null }; }),

  searchEvents: (c) => call("GET", "/events" + qs(c), () => {
    let list = db.events.slice();
    if (c.q) { const q = c.q.toLowerCase();
      list = list.filter((e) => (e.title + " " + (e.description || "")).toLowerCase().includes(q)); }
    if (c.venue) { const v = c.venue.toLowerCase(); list = list.filter((e) => e.venue.toLowerCase().includes(v)); }
    if (c.from) list = list.filter((e) => e.startTime >= new Date(c.from).getTime());
    if (c.to) list = list.filter((e) => e.startTime <= new Date(c.to).getTime());
    if (c.status) list = list.filter((e) => e.status === c.status);
    if (c.availableOnly) list = list.filter((e) => seatsRemaining(e) > 0);
    if (c.upcomingOnly) list = list.filter((e) => e.startTime > Date.now());
    const dir = (c.sort || "startTime,asc").split(",")[1] === "desc" ? -1 : 1;
    const key = (c.sort || "startTime,asc").split(",")[0];
    list.sort((a, b) => (key === "title" ? a.title.localeCompare(b.title) : a.startTime - b.startTime) * dir);
    return { content: list.map(toEventResponse), totalElements: list.length, number: 0, size: 20,
             totalPages: 1, first: true, last: true };
  }),

  getEvent: (id) => call("GET", "/events/" + id, () => {
    const e = eventOf(id); if (!e) throw notFound("Event not found: " + id);
    return toEventResponse(e);
  }),

  createEvent: (body, session) => call("POST", "/events", () => {
    const u = requireUser(session);
    if (u.role === "ATTENDEE") throw forbidden("You do not have permission to perform this action");
    if (!body.title || !body.venue) throw badReq("One or more fields are invalid");
    const start = new Date(body.startTime).getTime();
    if (!start || start <= Date.now()) throw badReq("startTime must be in the future");
    if (!body.capacity || body.capacity < 1) throw badReq("capacity must be at least 1");
    const e = { id: ++db.seq.event, organizerId: u.id, title: body.title, description: body.description,
                venue: body.venue, startTime: start, capacity: Number(body.capacity), bookedCount: 0, status: "SCHEDULED" };
    db.events.push(e); saveDb();
    return toEventResponse(e);
  }),

  updateEvent: (id, body, session) => call("PUT", "/events/" + id, () => {
    const u = requireUser(session); const e = eventOf(id);
    if (!e) throw notFound("Event not found: " + id);
    if (e.organizerId !== u.id && u.role !== "ADMIN") throw forbidden("You do not own this event");
    if (e.status !== "SCHEDULED") throw badReq("This event is not editable");
    if (Number(body.capacity) < e.bookedCount)
      throw badReq("Capacity cannot be lower than the " + e.bookedCount + " seats already booked");
    Object.assign(e, { title: body.title, description: body.description, venue: body.venue,
                       startTime: new Date(body.startTime).getTime(), capacity: Number(body.capacity) });
    saveDb(); return toEventResponse(e);
  }),

  cancelEvent: (id, reason, session) => call("POST", "/events/" + id + "/cancel", () => {
    const u = requireUser(session); const e = eventOf(id);
    if (!e) throw notFound("Event not found: " + id);
    if (e.organizerId !== u.id && u.role !== "ADMIN") throw forbidden("You do not own this event");
    e.status = "CANCELLED"; e.cancelReason = reason || null;
    db.bookings.filter((b) => b.eventId === e.id && b.status !== "CANCELLED")
      .forEach((b) => { b.status = "CANCELLED"; b.cancelledAt = Date.now(); });
    e.bookedCount = 0; saveDb();
    return toEventResponse(e);
  }),

  deleteEvent: (id, session) => call("DELETE", "/events/" + id, () => {
    const u = requireUser(session); const e = eventOf(id);
    if (!e) throw notFound("Event not found: " + id);
    if (e.organizerId !== u.id && u.role !== "ADMIN") throw forbidden("You do not own this event");
    if (db.bookings.some((b) => b.eventId === e.id && b.status === "CONFIRMED"))
      throw badReq("This event has confirmed bookings. Cancel it instead so attendees are told.");
    db.events = db.events.filter((x) => x.id !== e.id); saveDb();
    return { __status: 204, body: null };
  }),

  eventAttendees: (id, session) => call("GET", "/events/" + id + "/bookings", () => {
    const u = requireUser(session); const e = eventOf(id);
    if (!e) throw notFound("Event not found: " + id);
    if (e.organizerId !== u.id && u.role !== "ADMIN") throw forbidden("You do not own this event");
    const rows = db.bookings.filter((b) => b.eventId === e.id && b.status !== "CANCELLED")
      .sort((a, b) => a.bookedAt - b.bookedAt).map(toBookingResponse);
    return { content: rows, totalElements: rows.length, number: 0, size: 50, totalPages: 1 };
  }),

  /* Mirrors BookingService.bookEvent: confirm if a seat is free, else queue. */
  book: (eventId, session) => call("POST", "/events/" + eventId + "/bookings", () => {
    const u = requireUser(session); const e = eventOf(eventId);
    if (!e) throw notFound("Event not found: " + eventId);
    if (e.status !== "SCHEDULED") throw badReq("This event is not open for booking");
    if (e.startTime < Date.now()) throw badReq("This event has already started");
    if (activeBooking(u.id, e.id)) throw conflict("You already have an active booking for this event");
    let status;
    if (seatsRemaining(e) > 0) { e.bookedCount += 1; status = "CONFIRMED"; } else { status = "WAITLISTED"; }
    const b = { id: ++db.seq.booking, userId: u.id, eventId: e.id, status, bookedAt: Date.now() };
    db.bookings.push(b); saveDb();
    return toBookingResponse(b);
  }),

  /* Mirrors BookingService.cancelBooking: a freed seat goes to the longest waiter. */
  cancelBooking: (bookingId, session) => call("DELETE", "/bookings/" + bookingId, () => {
    const u = requireUser(session);
    const b = db.bookings.find((x) => x.id === Number(bookingId));
    if (!b) throw notFound("Booking not found: " + bookingId);
    if (b.userId !== u.id) throw forbidden("You do not own this booking");
    if (b.status === "CANCELLED") return { __status: 204, body: null };
    const wasConfirmed = b.status === "CONFIRMED";
    b.status = "CANCELLED"; b.cancelledAt = Date.now();
    if (wasConfirmed) {
      const e = eventOf(b.eventId);
      const next = db.bookings.filter((x) => x.eventId === b.eventId && x.status === "WAITLISTED")
        .sort((x, y) => x.bookedAt - y.bookedAt)[0];
      if (next) { next.status = "CONFIRMED"; next.promotedAt = Date.now(); }
      else if (e) { e.bookedCount = Math.max(0, e.bookedCount - 1); }
    }
    saveDb(); return { __status: 204, body: null };
  }),

  myBookings: (session) => call("GET", "/users/me/bookings", () => {
    const u = requireUser(session);
    return db.bookings.filter((b) => b.userId === u.id)
      .sort((a, b) => b.bookedAt - a.bookedAt).map(toBookingResponse);
  }),

  /* Not an endpoint: lets the demo show a promotion happening to someone else. */
  __simulateRush: (eventId) => {
    const e = eventOf(eventId); if (!e) return 0;
    const pool = db.users.filter((u) => u.role === "ATTENDEE" && !activeBooking(u.id, e.id));
    let n = 0;
    pool.forEach((u) => {
      let status;
      if (seatsRemaining(e) > 0) { e.bookedCount += 1; status = "CONFIRMED"; } else { status = "WAITLISTED"; }
      db.bookings.push({ id: ++db.seq.booking, userId: u.id, eventId: e.id, status, bookedAt: Date.now() + n });
      n++;
    });
    saveDb(); return n;
  },
};

function qs(c) {
  const p = Object.entries(c || {}).filter(([, v]) => v !== "" && v !== null && v !== undefined && v !== false)
    .map(([k, v]) => k + "=" + encodeURIComponent(v));
  return p.length ? "?" + p.join("&") : "";
}

/* ============================================================
   Shared helpers
   ============================================================ */
const fmtDate = (iso) => new Date(iso).toLocaleDateString(undefined,
  { weekday: "short", day: "numeric", month: "short", year: "numeric" });
const fmtTime = (iso) => new Date(iso).toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
const fmtWhen = (iso) => fmtDate(iso) + " at " + fmtTime(iso);
/* Card-sized: weekday, day, month, time. The year is noise inside a year. */
const fmtShort = (iso) => new Date(iso).toLocaleDateString(undefined,
  { weekday: "short", day: "numeric", month: "short" }) + ", " + fmtTime(iso);
function countdown(iso) {
  const d = new Date(iso).getTime() - Date.now();
  if (d < 0) return "already started";
  const days = Math.floor(d / 86400000);
  if (days > 1) return "in " + days + " days";
  if (days === 1) return "tomorrow";
  const hrs = Math.max(1, Math.round(d / 3600000));
  return "in " + hrs + (hrs === 1 ? " hour" : " hours");
}
const initials = (name) => (name || "?").split(" ").map((w) => w[0]).slice(0, 2).join("").toUpperCase();
function toLocalInput(iso) {
  const d = new Date(iso); const p = (n) => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + "T" + p(d.getHours()) + ":" + p(d.getMinutes());
}

function Icon({ name, size = 17 }) {
  const paths = {
    close: "M6 6l12 12M18 6L6 18",
    wire: "M4 7h7M4 12h16M4 17h11M17 4l3 3-3 3",
    sun: "M12 4v2M12 18v2M4 12h2M18 12h2M6.3 6.3l1.4 1.4M16.3 16.3l1.4 1.4M6.3 17.7l1.4-1.4M16.3 7.7l1.4-1.4",
    moon: "M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z",
    pin: "M12 21s7-5.5 7-11a7 7 0 1 0-14 0c0 5.5 7 11 7 11z",
    plus: "M12 5v14M5 12h14",
    back: "M15 6l-6 6 6 6",
    check: "M5 12.5l4.5 4.5L19 7",

}

function StatusChip({ event }) {
  if (event.status === "CANCELLED") return <span className="chip off">Cancelled</span>;
  if (event.status === "COMPLETED") return <span className="chip done">Finished</span>;
  if (new Date(event.startTime).getTime() < Date.now()) return <span className="chip done">Started</span>;
  if (event.seatsRemaining > 0) return <span className="chip ok">{event.seatsRemaining} seats left</span>;
  return <span className="chip full">Waitlist only</span>;
}

/* ============================================================
   SeatBlock — the room, drawn as a solid.
   Every seat is a real element: booked seats stand proud of the
   floor, free seats stay flush, and the people who could not get
   a seat queue along the edge. Occupancy is readable as height.
   ============================================================ */
/* A room of four and a room of a hundred both need to fill the same frame,
   so seat size follows capacity rather than sitting at one fixed value. */
function seatScale(cap) {
  if (cap <= 4)  return { size: 52, gap: 13, maxCols: 2,  minH: 230 };
  if (cap <= 12) return { size: 34, gap: 9,  maxCols: 4,  minH: 270 };
  if (cap <= 30) return { size: 25, gap: 7,  maxCols: 6,  minH: 300 };
  if (cap <= 70) return { size: 19, gap: 6,  maxCols: 9,  minH: 330 };
  return { size: 15, gap: 5, maxCols: 12, minH: 360 };
}

function SeatBlock({ event, queue = 0, mySeat = null, size = 18, gap = 6, interactive = true, animate = false, maxCols = 12, minH = 380 }) {
  const rotor = useRef(null);
  const rot = useRef({ spin: -34, tilt: 56 });
  const drag = useRef(null);

  const apply = () => {
    if (rotor.current) rotor.current.style.transform =
      `rotateX(${rot.current.tilt}deg) rotateZ(${rot.current.spin}deg)`;
  };
  useEffect(apply, []);

  useEffect(() => {
    if (!animate || window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    let raf, t = 0;
    const loop = () => {
      if (!drag.current) { t += 0.0024; rot.current.spin = -34 + Math.sin(t) * 8.5; apply(); }
      raf = requestAnimationFrame(loop);
    };
    raf = requestAnimationFrame(loop);
    return () => cancelAnimationFrame(raf);
  }, [animate]);

  useEffect(() => {
    const move = (e) => {
      if (!drag.current) return;
      rot.current.spin = drag.current.spin + (e.clientX - drag.current.x) * 0.45;
      rot.current.tilt = Math.max(20, Math.min(80, drag.current.tilt - (e.clientY - drag.current.y) * 0.25));
      apply();
    };
    const up = () => { drag.current = null; };
    window.addEventListener("pointermove", move);
    window.addEventListener("pointerup", up);
    window.addEventListener("pointercancel", up);
    return () => {
      window.removeEventListener("pointermove", move);
      window.removeEventListener("pointerup", up);
      window.removeEventListener("pointercancel", up);
    };
  }, []);

  const onDown = (e) => {
    if (!interactive) return;
    drag.current = { x: e.clientX, y: e.clientY, spin: rot.current.spin, tilt: rot.current.tilt };
  };

  const cap = event.capacity;
  const shown = Math.min(cap, 144);
  const perSeat = cap / shown;
  const cols = Math.min(maxCols, Math.max(3, Math.ceil(Math.sqrt(shown * 1.6))));
  const takenShown = Math.round(event.bookedCount / perSeat);
  const dead = event.status === "CANCELLED";
  const qShown = Math.min(queue, 9);

  const seats = [];
  for (let i = 0; i < shown; i++) {
    const taken = i < takenShown;
    const isMine = mySeat !== null && taken && i === Math.min(takenShown - 1, mySeat);
    seats.push(
      <div key={i}
        className={"seat " + (dead ? "dead" : isMine ? "you" : taken ? "taken" : "free") + (animate ? " rise" : "")}
        style={animate ? { animationDelay: (i * 9) + "ms" } : undefined} />
    );
  }

  return (
    <div>
      <div className="stage" onPointerDown={onDown}
           style={{ cursor: interactive ? "grab" : "default", minHeight: minH }}>
        <div className="block-rot" ref={rotor}>
          <div style={{ display: "flex", alignItems: "flex-start", transformStyle: "preserve-3d" }}>
            <div className="floor">
              <div className="seats" style={{ gridTemplateColumns: `repeat(${cols}, ${size}px)`, gap: gap + "px",
                                              ["--sz"]: size + "px" }}>
                {seats}
              </div>
            </div>
            {qShown > 0 && (
              <div className="queue-line">
                {Array.from({ length: qShown }).map((_, i) => (
                  <span className={"pin" + (animate ? " rise" : "")} key={i}
                        style={animate ? { animationDelay: (shown * 9 + i * 60) + "ms" } : undefined} />
                ))}
              </div>
            )}
          </div>
        </div>
      </div>
      <div className="stage-legend">
        <span className="lg"><i className="t" />{event.bookedCount} seats taken</span>
        <span className="lg"><i className="f" />{event.seatsRemaining} free</span>
        {queue > 0 && <span className="lg"><i className="w" />{queue} waiting at the door</span>}
        {perSeat > 1 && <span className="lg">1 block = {Math.round(perSeat)} seats</span>}
      </div>
    </div>
  );
}

/* ============================================================
   Event card — tilts toward the pointer so the seat strip reads
   as a solid object rather than a bar chart.
   ============================================================ */
function EventCard({ event, queue, onOpen }) {
  const ref = useRef(null);
  const [t, setT] = useState(null);
  const bars = 20;
  const filled = Math.min(bars, Math.round((event.bookedCount / event.capacity) * bars));
  const over = queue > 0 ? Math.min(6, Math.max(1, Math.round((queue / event.capacity) * bars))) : 0;

  const move = (e) => {
    const r = ref.current.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width - 0.5, y = (e.clientY - r.top) / r.height - 0.5;
    setT({ x: -y * 7, y: x * 9 });
  };
  return (
    <div style={{ perspective: 900 }}>
      <button ref={ref} className="card" onMouseMove={move} onMouseLeave={() => setT(null)} onClick={() => onOpen(event)}
        style={{ transform: t ? `rotateX(${t.x}deg) rotateY(${t.y}deg)` : "none",
                 transition: t ? "box-shadow .3s" : "transform .5s cubic-bezier(.22,.68,.32,1), box-shadow .3s" }}>
        <div className="card-top lift">
          <div style={{ minWidth: 0 }}>
            <h3>{event.title}</h3>
            <div className="when">{fmtShort(event.startTime)}</div>
          </div>
          <StatusChip event={event} />
        </div>
        <div className="where lift"><Icon name="pin" size={14} />{event.venue}</div>
        <div className="occ lift" title={event.bookedCount + " of " + event.capacity + " seats taken"}>
          {Array.from({ length: bars }).map((_, i) => <i key={i} className={i < filled ? "on" : ""} />)}
          {over > 0 && <span className="spill" />}
          {Array.from({ length: over }).map((_, i) => <i key={"q" + i} className="q" />)}
        </div>
        <div className="card-foot lift">
          <span className="seats-left">
            {event.status === "CANCELLED" ? <span style={{ color: "var(--stop)" }}>Called off</span>
              : event.seatsRemaining > 0
                ? <><b>{event.seatsRemaining}</b> of {event.capacity} seats free</>
                : <><b>{queue}</b> waiting for a seat</>}
          </span>
          <span className="byline">{event.organizerName}</span>
        </div>
      </button>
    </div>
  );
}

               onChange={(e) => set("from", e.target.value)} />

/* ============================================================
   Event detail — the room up close, plus the one action that
   matters: take a seat, or take a place in the queue.
   ============================================================ */
function EventDrawer({ event, queue, myBooking, session, onClose, onBook, onCancelBooking, busy }) {
  const started = new Date(event.startTime).getTime() < Date.now();
  const cancelled = event.status === "CANCELLED";
  const full = event.seatsRemaining === 0;

  let action = null;
  if (myBooking && myBooking.status === "CONFIRMED") {
    action = (
      <div className="panel" style={{ borderColor: "var(--free)", background: "var(--free-soft)" }}>
        <div style={{ display: "flex", gap: 12, alignItems: "flex-start" }}>
          <span style={{ color: "var(--free)", marginTop: 2 }}><Icon name="check" size={20} /></span>
          <div style={{ flex: 1 }}>
            <b style={{ fontSize: 16 }}>Your seat is confirmed</b>
            <p style={{ fontSize: 14, color: "var(--ink-2)", marginTop: 4 }}>
              Booked {fmtDate(myBooking.bookedAt)}. Give it up and the next person in the queue takes it straight away.
            </p>
            <button className="btn btn-danger btn-sm" style={{ marginTop: 12 }} disabled={busy}
                    onClick={() => onCancelBooking(myBooking)}>Give up my seat</button>
          </div>
        </div>
      </div>
    );
  } else if (myBooking && myBooking.status === "WAITLISTED") {
    action = (
      <div className="panel" style={{ borderColor: "var(--wait)", background: "var(--wait-soft)" }}>
        <div style={{ display: "flex", gap: 14, alignItems: "center" }}>
          <div className="pos" style={{ width: 46, height: 46, fontSize: 19, background: "var(--wait)", color: "var(--surface)" }}>
            {myBooking.waitlistPosition}
          </div>
          <div style={{ flex: 1 }}>
            <b style={{ fontSize: 16 }}>You are number {myBooking.waitlistPosition} in the queue</b>
            <p style={{ fontSize: 14, color: "var(--ink-2)", marginTop: 3 }}>
              {myBooking.waitlistPosition === 1
                ? "The next seat that frees up is yours."
                : (myBooking.waitlistPosition - 1) + " people are ahead of you."}
            </p>
          </div>
          <button className="btn btn-ghost btn-sm" disabled={busy} onClick={() => onCancelBooking(myBooking)}>Leave queue</button>
        </div>
      </div>
    );
  } else if (cancelled) {
    action = <div className="panel" style={{ color: "var(--stop)", background: "var(--stop-soft)", borderColor: "var(--stop)" }}>
      <b>This event was called off.</b>
      <p style={{ fontSize: 14, marginTop: 4, color: "var(--ink-2)" }}>Everyone holding a seat or a queue place was released and told why.</p>
    </div>;
  } else if (started) {
    action = <div className="panel" style={{ color: "var(--muted)" }}>This event has already started, so booking is closed.</div>;
  } else if (!session) {
    action = <button className="btn btn-primary btn-lg" style={{ width: "100%" }} onClick={() => onBook(event)}>
      Sign in to book a seat</button>;
  } else if (session.role === "ORGANIZER" || session.role === "ADMIN") {
    action = <div className="panel" style={{ color: "var(--muted)", fontSize: 14 }}>
      Organizer accounts run events rather than attend them. Sign in as an attendee to take a seat.</div>;
  } else if (full) {
    action = (
      <div>
        <button className="btn btn-wait btn-lg" style={{ width: "100%" }} disabled={busy} onClick={() => onBook(event)}>
          {busy ? <span className="spin" /> : null} Join the waitlist{queue > 0 ? " — you would be number " + (queue + 1) : ""}
        </button>
        <p style={{ fontSize: 13.5, color: "var(--muted)", marginTop: 10, textAlign: "center" }}>
          No seats left right now. You move up automatically when someone cancels.
        </p>
      </div>
    );
  } else {
    action = (
      <div>
        <button className="btn btn-primary btn-lg" style={{ width: "100%" }} disabled={busy} onClick={() => onBook(event)}>
          {busy ? <span className="spin" /> : null} Book a seat
        </button>
        <p style={{ fontSize: 13.5, color: "var(--muted)", marginTop: 10, textAlign: "center" }}>
          {event.seatsRemaining === 1 ? "One seat left." : event.seatsRemaining + " seats left."} Free, and you can give it back any time.
        </p>
      </div>
    );
  }

  return (
    <>
      <div className="scrim" onClick={onClose} />
      <div className="drawer" role="dialog" aria-label={event.title}>
        <div className="drawer-in">
          <div className="drawer-head">
            <div>
              <StatusChip event={event} />
              <h2 style={{ fontSize: 30, marginTop: 12, letterSpacing: "-.035em" }}>{event.title}</h2>
              <p className="when" style={{ fontSize: 14.5, marginTop: 8 }}>
                {fmtWhen(event.startTime)} · {countdown(event.startTime)}
              </p>
            </div>
            <button className="icon-btn" onClick={onClose} aria-label="Close"><Icon name="close" /></button>
          </div>

          <div style={{ margin: "6px -8px 0" }}>
            <SeatBlock event={event} queue={queue} {...seatScale(event.capacity)}
                       mySeat={myBooking && myBooking.status === "CONFIRMED" ? 0 : null} />
          </div>

          <div className="meta-grid">
            <div style={{ gridColumn: "1 / -1" }}><small>Venue</small><b>{event.venue}</b></div>
            <div><small>Organizer</small><b>{event.organizerName}</b></div>
            <div><small>Capacity</small><b>{event.capacity}</b></div>
            <div><small>Waiting</small><b>{queue}</b></div>
          </div>

          {event.description && (
            <p style={{ color: "var(--ink-2)", lineHeight: 1.62, maxWidth: "62ch", marginBottom: 20 }}>
              {event.description}
            </p>
          )}

          {action}
        </div>
      </div>
    </>
  );
}

/* ============================================================
   Browse
   ============================================================ */
function Browse({ events, loading, criteria, setCriteria, queues, onOpen, onRush, session }) {
  return (
    <div className="wrap browse">
      <FilterRail criteria={criteria} setCriteria={setCriteria} />
      <div>
        <div className="results-head">
          <h2>{loading ? "Looking…" : events.length + (events.length === 1 ? " event" : " events")}</h2>
          {session && session.role !== "ATTENDEE" && (
            <button className="btn btn-ghost btn-sm" onClick={onRush}>
              <Icon name="people" size={15} /> Fill a room and watch the queue form
            </button>
          )}
        </div>
        {loading ? (
          <div className="cards">{[0, 1, 2, 3].map((i) => <div className="skel" key={i} />)}</div>
        ) : events.length === 0 ? (
          <div className="empty">

/* The public EventResponse deliberately does not expose how many people are
   queued for an event — only the organizer's roster does. The demo can read
   it straight from its own store; the React client falls back to
   `event.waitlistCount` if you choose to add that field server-side. */
api.__queueCounts = () => {
  const out = {};
  db.bookings.filter((b) => b.status === "WAITLISTED").forEach((b) => { out[b.eventId] = (out[b.eventId] || 0) + 1; });
  return out;
};

/* ============================================================
   My bookings
   ============================================================ */
function MyBookings({ bookings, loading, onCancel, onOpenEvent, busyId, goBrowse }) {
  const active = bookings.filter((b) => b.status !== "CANCELLED");
  const past = bookings.filter((b) => b.status === "CANCELLED");

  return (
    <div className="wrap" style={{ padding: "36px 28px 80px", maxWidth: 820 }}>
      <h2 style={{ fontSize: 30, marginBottom: 6 }}>My bookings</h2>
      <p style={{ color: "var(--muted)", marginBottom: 24 }}>
        Queue places are worked out fresh each time this list loads, so the number you see is the number you are.
      </p>

      {loading ? <div className="skel" style={{ height: 180 }} /> : active.length === 0 ? (
        <div className="empty">
          <h3>No bookings yet</h3>
          <p style={{ marginBottom: 16 }}>Take a seat at something and it will show up here.</p>
          <button className="btn btn-primary" onClick={goBrowse}>Find an event</button>
        </div>
      ) : (
        <div className="panel">
          {active.map((b) => (
            <div className="row" key={b.id}>
              <span className={"pos " + (b.status === "CONFIRMED" ? "conf" : "")}>
                {b.status === "CONFIRMED" ? <Icon name="check" size={16} /> : b.waitlistPosition}
              </span>
              <div className="grow">
                <b>{b.eventTitle}</b>
                <small>
                  {b.status === "CONFIRMED"
                    ? "Seat confirmed, booked " + fmtDate(b.bookedAt)
                    : "Number " + b.waitlistPosition + " in the queue, joined " + fmtDate(b.bookedAt)}
                </small>
              </div>
              <button className="btn btn-quiet btn-sm" onClick={() => onOpenEvent(b.eventId)}>Open</button>
              <button className="btn btn-ghost btn-sm" disabled={busyId === b.id} onClick={() => onCancel(b)}>
                {busyId === b.id ? <span className="spin" /> : b.status === "CONFIRMED" ? "Give up seat" : "Leave queue"}
              </button>
            </div>
          ))}
        </div>
      )}

      {past.length > 0 && (
        <>
          <h3 style={{ fontSize: 17, margin: "30px 0 12px", color: "var(--muted)" }}>No longer active</h3>
          <div className="panel">
            {past.map((b) => (
              <div className="row" key={b.id} style={{ opacity: .68 }}>
                <span className="pos" style={{ background: "var(--surface-2)", color: "var(--muted)" }}>
                  <Icon name="close" size={14} />
                </span>
                <div className="grow"><b>{b.eventTitle}</b><small>Cancelled</small></div>
              </div>
            ))}
          </div>
        </>
      )}
    </div>
  );
}

        <div className="field">
          <label htmlFor="e-d">What happens there</label>
          <textarea id="e-d" className="input" value={f.description} onChange={(e) => set("description", e.target.value)}
                    placeholder="Two hours, hands on, bring a laptop." />
        </div>
        <div className="field">
          <label htmlFor="e-v">Where</label>
          <input id="e-v" className="input" value={f.venue} onChange={(e) => set("venue", e.target.value)}
                 placeholder="Innovation Hub, Addis Ababa" />
        </div>
        <div style={{ display: "grid", gridTemplateColumns: "1.4fr 1fr", gap: 12 }}>
          <div className="field">
            <label htmlFor="e-s">Starts</label>
            <input id="e-s" className="input" type="datetime-local" value={f.startTime}
                   onChange={(e) => set("startTime", e.target.value)} />
          </div>
          <div className="field">
            <label htmlFor="e-c">Seats</label>
            <input id="e-c" className="input" type="number" min="1" value={f.capacity}
                   onChange={(e) => set("capacity", e.target.value)} />
          </div>
        </div>
        <p style={{ fontSize: 13, color: "var(--muted)", marginBottom: 16 }}>
          {initial ? "Seats cannot go below the number already booked." : "Once the seats are gone, later arrivals join a queue instead of being turned away."}
        </p>
        <div style={{ display: "flex", gap: 10, justifyContent: "flex-end" }}>
          <button className="btn btn-ghost" onClick={onClose}>Cancel</button>
          <button className="btn btn-primary" disabled={busy}
                  onClick={() => onSave({ ...f, startTime: new Date(f.startTime).toISOString(), capacity: Number(f.capacity) })}>
            {busy ? <span className="spin" /> : null}{initial ? "Save changes" : "Publish event"}
          </button>
        </div>
      </div>
    </>
  );
}

function Roster({ event, rows, loading, onClose }) {
  const confirmed = rows.filter((r) => r.status === "CONFIRMED");
  const waiting = rows.filter((r) => r.status === "WAITLISTED").sort((a, b) => a.waitlistPosition - b.waitlistPosition);
  return (
    <>
      <div className="scrim" onClick={onClose} />
      <div className="drawer" role="dialog" aria-label="Attendees">
        <div className="drawer-in">
          <div className="drawer-head">
            <div>
              <h2 style={{ fontSize: 26 }}>Who is coming</h2>
              <p className="when" style={{ marginTop: 6 }}>{event.title}</p>
            </div>
            <button className="icon-btn" onClick={onClose} aria-label="Close"><Icon name="close" /></button>
          </div>
          {loading ? <div className="skel" style={{ height: 200 }} /> : (
            <>
              <div className="panel">
                <h4 style={{ fontSize: 15, marginBottom: 6 }}>{confirmed.length} holding a seat</h4>
                {confirmed.length === 0 ? <p style={{ color: "var(--muted)", fontSize: 14 }}>Nobody yet.</p> :
                  confirmed.map((r) => (
                    <div className="row" key={r.id}>
                      <span className="avatar">{initials(r.attendeeName)}</span>
                      <div className="grow"><b>{r.attendeeName}</b><small>{r.attendeeEmail}</small></div>
                      <small style={{ color: "var(--muted)" }}>{fmtDate(r.bookedAt)}</small>
                    </div>
                  ))}
              </div>
              <div className="panel">
                <h4 style={{ fontSize: 15, marginBottom: 6 }}>{waiting.length} waiting for a seat</h4>
                {waiting.length === 0 ? <p style={{ color: "var(--muted)", fontSize: 14 }}>No queue. Everyone who asked got in.</p> :
                  waiting.map((r) => (
                    <div className="row" key={r.id}>
                      <span className="pos">{r.waitlistPosition}</span>
                      <div className="grow"><b>{r.attendeeName}</b><small>{r.attendeeEmail}</small></div>
                      <small style={{ color: "var(--muted)" }}>joined {fmtDate(r.bookedAt)}</small>
                    </div>
                  ))}
              </div>
            </>
          )}
        </div>
      </div>
    </>
  );
}

function Organizer({ session, events, queues, loading, onNew, onEdit, onCancelEvent, onDelete, onRoster, busyId }) {
  const mine = events.filter((e) => e.organizerName === session.name);
  const totalSeats = mine.reduce((s, e) => s + e.capacity, 0);
  const totalBooked = mine.reduce((s, e) => s + e.bookedCount, 0);
  const totalQueue = mine.reduce((s, e) => s + (queues[e.id] || 0), 0);

  return (
    <div className="wrap" style={{ padding: "36px 28px 80px", maxWidth: 900 }}>
      <div className="results-head">
        <div>
          <h2 style={{ fontSize: 30 }}>Events you run</h2>
          <p style={{ color: "var(--muted)", marginTop: 6 }}>
            {totalBooked} of {totalSeats} seats claimed{totalQueue > 0 ? ", " + totalQueue + " people queued" : ""}.
          </p>
        </div>
        <button className="btn btn-primary" onClick={onNew}><Icon name="plus" size={16} /> New event</button>
      </div>

      {loading ? <div className="skel" style={{ height: 180 }} /> : mine.length === 0 ? (
        <div className="empty">
          <h3>You have not put on anything yet</h3>
          <p style={{ marginBottom: 16 }}>Set the seats, and EventHub handles the rest — including who gets in when someone drops out.</p>
          <button className="btn btn-primary" onClick={onNew}>Put on an event</button>
        </div>
      ) : mine.map((e) => (
        <div className="panel" key={e.id} style={{ marginBottom: 14 }}>
          <div style={{ display: "flex", gap: 18, alignItems: "flex-start", flexWrap: "wrap" }}>
            <div style={{ flex: 1, minWidth: 220 }}>
              <div style={{ display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap" }}>
                <h3 style={{ fontSize: 19 }}>{e.title}</h3>
                <StatusChip event={e} />
              </div>
              <p className="when">{fmtWhen(e.startTime)} — {e.venue}</p>
              <div className="occ" style={{ maxWidth: 300, marginTop: 12 }}>
                {Array.from({ length: 20 }).map((_, i) => (
                  <i key={i} className={i < Math.min(20, Math.round((e.bookedCount / e.capacity) * 20)) ? "on" : ""} />
                ))}
                {(queues[e.id] || 0) > 0 && <span className="spill" />}
                {Array.from({ length: Math.min(6, queues[e.id] || 0) }).map((_, i) => <i key={"q" + i} className="q" />)}
              </div>
              <p style={{ fontSize: 13.5, color: "var(--ink-2)", marginTop: 8 }}>
                {e.bookedCount} of {e.capacity} seats taken{queues[e.id] ? ", " + queues[e.id] + " waiting" : ""}
              </p>
            </div>
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
              <button className="btn btn-ghost btn-sm" onClick={() => onRoster(e)}>
                <Icon name="people" size={15} /> Attendees
              </button>
              {e.status === "SCHEDULED" && (
                <button className="btn btn-ghost btn-sm" onClick={() => onEdit(e)}><Icon name="edit" size={15} /> Edit</button>
              )}
              {e.status === "SCHEDULED" && (
                <button className="btn btn-danger btn-sm" disabled={busyId === e.id} onClick={() => onCancelEvent(e)}>
                  Call it off
                </button>
              )}
              {e.bookedCount === 0 && (
                <button className="btn btn-quiet btn-sm" onClick={() => onDelete(e)} title="Only possible with no confirmed seats">
                  <Icon name="trash" size={15} />
                </button>
              )}
            </div>
          </div>
        </div>
      ))}
    </div>
  );
}

/* ============================================================
   Wire log — the HTTP the page is actually speaking
   ============================================================ */
function WireDrawer({ onClose, onReset }) {
  const [, force] = useState(0);
  useEffect(() => {
    const fn = () => force((n) => n + 1);
    wire.listeners.add(fn);
    return () => wire.listeners.delete(fn);
  }, []);
  return (
    <>
      <div className="scrim" onClick={onClose} />
      <div className="wire" role="dialog" aria-label="API calls">
        <div className="wire-head">
          <Icon name="wire" />
          <div style={{ flex: 1 }}>
            <b style={{ fontSize: 15 }}>Calls to the API</b>
            <div style={{ fontSize: 12.5, color: "var(--muted)" }}>Every request this page made, newest first</div>
          </div>
          <button className="icon-btn" onClick={onClose} aria-label="Close"><Icon name="close" /></button>
        </div>
        <div className="wire-list">
          {wire.entries.length === 0 && <p style={{ padding: 20, color: "var(--muted)", fontSize: 14 }}>
            Nothing yet. Browse or book something and the traffic shows up here.</p>}
          {wire.entries.map((e) => (
            <div className="wl" key={e.id}>
              <span className={"verb " + e.method}>{e.method}</span>
              <span className="path">{e.path}</span>
              <span className={"code " + (e.status < 400 ? "g" : "r")}>{e.status}</span>
              <span style={{ color: "var(--muted)", fontSize: 12 }}>{e.ms}ms</span>
            </div>
          ))}
        </div>
        <div style={{ padding: 14, borderTop: "1px solid var(--hair)", display: "flex", gap: 8 }}>
          <button className="btn btn-ghost btn-sm" style={{ flex: 1 }} onClick={onReset}>
            <Icon name="rotate" size={15} /> Reset the demo data
          </button>
        </div>
      </div>
    </>
  );
}

function Toasts({ items, dismiss }) {
  return (
    <div className="toasts">
      {items.map((t) => (
        <div className={"toast " + (t.kind || "")} key={t.id} onClick={() => dismiss(t.id)} role="status">
          <div style={{ flex: 1 }}><b>{t.title}</b>{t.body && <span>{t.body}</span>}</div>
        </div>
      ))}
    </div>
  );
}

/* ============================================================
   App
   ============================================================ */
function App() {
  const [theme, setTheme] = useState(() => {
    try { return localStorage.getItem("eventhub.theme") || "auto"; } catch (e) { return "auto"; }
  });
  useEffect(() => {
    if (theme === "auto") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", theme);
    try { localStorage.setItem("eventhub.theme", theme); } catch (e) {}
  }, [theme]);
  const resolved = theme === "auto"
    ? (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light") : theme;

  const [session, setSession] = useState(() => {
    try { const r = localStorage.getItem(SESSION_KEY); return r ? JSON.parse(r) : null; } catch (e) { return null; }
  });
  useEffect(() => {
    try {
      if (session) localStorage.setItem(SESSION_KEY, JSON.stringify(session));
      else localStorage.removeItem(SESSION_KEY);
    } catch (e) {}
  }, [session]);

  const [view, setView] = useState({ name: "browse" });
  const [criteria, setCriteria] = useState({ q: "", venue: "", from: "", sort: "startTime,asc",
                                             upcomingOnly: true, availableOnly: false, status: "" });
  const [events, setEvents] = useState([]);
  const [loadingEvents, setLoadingEvents] = useState(true);
  const [queues, setQueues] = useState({});
  const [bookings, setBookings] = useState([]);
  const [loadingBookings, setLoadingBookings] = useState(false);
  const [open, setOpen] = useState(null);          // event being viewed
  const [form, setForm] = useState(null);          // { event | null }
  const [formErr, setFormErr] = useState(null);
  const [roster, setRoster] = useState(null);      // { event, rows, loading }
  const [auth, setAuth] = useState(null);          // { note }
  const [showWire, setShowWire] = useState(false);
  const [busy, setBusy] = useState(null);
  const [toasts, setToasts] = useState([]);
  const [wireCount, setWireCount] = useState(0);

  useEffect(() => {
    const fn = () => setWireCount((n) => (showWire ? 0 : n + 1));
    wire.listeners.add(fn);
    return () => wire.listeners.delete(fn);
  }, [showWire]);
  useEffect(() => { if (showWire) setWireCount(0); }, [showWire]);

  const toast = useCallback((title, body, kind) => {
    const id = Math.random().toString(36).slice(2);
    setToasts((t) => [...t, { id, title, body, kind }]);
    setTimeout(() => setToasts((t) => t.filter((x) => x.id !== id)), 5200);
  }, []);
  const dismiss = (id) => setToasts((t) => t.filter((x) => x.id !== id));

  const loadEvents = useCallback(async (silent) => {
    if (!silent) setLoadingEvents(true);
    try {
      const page = await api.searchEvents(criteria);
      setEvents(page.content);
      setQueues(api.__queueCounts());
    } catch (e) { toast("Could not load events", e.detail, "bad"); }
    finally { setLoadingEvents(false); }
  }, [criteria, toast]);

  useEffect(() => { const t = setTimeout(() => loadEvents(), 220); return () => clearTimeout(t); }, [loadEvents]);

  const loadBookings = useCallback(async () => {
    if (!session) { setBookings([]); return; }
    setLoadingBookings(true);
    try { setBookings(await api.myBookings(session)); }
    catch (e) { if (e.status === 401) setSession(null); }
    finally { setLoadingBookings(false); }
  }, [session]);
  useEffect(() => { loadBookings(); }, [loadBookings]);

  const myBookingFor = (eventId) => bookings.find(
    (b) => b.eventId === eventId && b.status !== "CANCELLED");

  /* --- actions --- */
  const doBook = async (event) => {
    if (!session) { setAuth({ note: "Sign in and your seat at " + event.title + " is one tap away." }); return; }
    setBusy("book");
    try {
      const b = await api.book(event.id, session);
      await Promise.all([loadEvents(true), loadBookings()]);
      const fresh = await api.getEvent(event.id);
      setOpen(fresh);
      if (b.status === "CONFIRMED") toast("Seat confirmed", "You are in at " + event.title + ".", "good");
      else toast("You joined the queue", "Number " + b.waitlistPosition + " for " + event.title + ". You move up when someone cancels.", "warn");
    } catch (e) { toast(e.title || "That did not work", e.detail, "bad"); }
    finally { setBusy(null); }
  };

  const doCancelBooking = async (booking) => {
    setBusy(booking.id);
    try {
      const wasConfirmed = booking.status === "CONFIRMED";
      await api.cancelBooking(booking.id, session);
      await Promise.all([loadEvents(true), loadBookings()]);
      if (open) { try { setOpen(await api.getEvent(open.id)); } catch (e) {} }
      toast(wasConfirmed ? "Seat given up" : "Left the queue",
            wasConfirmed ? "It went straight to whoever was first in line." : "You are off the list for " + booking.eventTitle + ".",
            "good");
    } catch (e) { toast(e.title || "That did not work", e.detail, "bad"); }
    finally { setBusy(null); }
  };

  const saveEvent = async (payload) => {
    setBusy("form"); setFormErr(null);
    try {
      if (form.event) { await api.updateEvent(form.event.id, payload, session); toast("Changes saved", null, "good"); }
      else { await api.createEvent(payload, session); toast("Event published", "It is live and taking bookings.", "good"); }
      setForm(null); await loadEvents(true);
    } catch (e) { setFormErr(e.detail || "Check the fields and try again"); }
    finally { setBusy(null); }
  };

  const cancelEvent = async (event) => {
    setBusy(event.id);
    try {
      await api.cancelEvent(event.id, null, session);
      await Promise.all([loadEvents(true), loadBookings()]);
      toast("Event called off", "Everyone holding a seat or a queue place was released.", "warn");
    } catch (e) { toast(e.title || "That did not work", e.detail, "bad"); }
    finally { setBusy(null); }
  };

  const deleteEvent = async (event) => {
    try { await api.deleteEvent(event.id, session); await loadEvents(true); toast("Event deleted", null, "good"); }
    catch (e) { toast(e.title || "Cannot delete this", e.detail, "bad"); }
  };

  const openRoster = async (event) => {
    setRoster({ event, rows: [], loading: true });
    try { const page = await api.eventAttendees(event.id, session); setRoster({ event, rows: page.content, loading: false }); }
    catch (e) { setRoster(null); toast(e.title || "Cannot open the roster", e.detail, "bad"); }
  };

  const rush = async () => {
    const target = events.find((e) => e.status === "SCHEDULED" && e.seatsRemaining > 0 && e.seatsRemaining < 6)
      || events.find((e) => e.status === "SCHEDULED");
    if (!target) return;
    const n = api.__simulateRush(target.id);
    await Promise.all([loadEvents(true), loadBookings()]);
    toast("Four people just booked " + target.title,
          n ? "Seats went first, the rest formed a queue. Open it to see." : "Everyone already had a booking.", "warn");
  };

  const openEventById = async (id) => {
    try { setOpen(await api.getEvent(id)); } catch (e) { toast("Cannot open that event", e.detail, "bad"); }
  };

  const signOut = async () => {
    try { await api.logout(session); } catch (e) {}
    setSession(null); setBookings([]); setView({ name: "browse" });
    toast("Signed out", null, null);
  };

  /* The hero shows a room worth looking at: full, with a queue at the door.
     It sticks once chosen so filtering the list below does not blank it out. */
  const stuck = useRef(null);
  const featured = useMemo(() => {
    const live = events.filter((e) => e.status === "SCHEDULED");
    const pick = live.find((e) => e.seatsRemaining === 0 && e.capacity >= 12)
      || live.slice().sort((a, b) => b.capacity - a.capacity)[0] || events[0];
    if (pick) stuck.current = pick.id;
    const held = events.find((e) => e.id === stuck.current);
    return held || pick;
  }, [events]);

  const totals = useMemo(() => ({
    events: events.filter((e) => e.status === "SCHEDULED").length,
    seats: events.reduce((s, e) => s + e.capacity, 0),
    booked: events.reduce((s, e) => s + e.bookedCount, 0),
    waiting: Object.values(queues).reduce((s, n) => s + n, 0),
  }), [events, queues]);

  useEffect(() => {
    const esc = (e) => {
      if (e.key !== "Escape") return;
      if (form) setForm(null); else if (roster) setRoster(null); else if (auth) setAuth(null);
      else if (showWire) setShowWire(false); else if (open) setOpen(null);
    };
    window.addEventListener("keydown", esc);
    return () => window.removeEventListener("keydown", esc);
  }, [form, roster, auth, showWire, open]);

  return (
    <>
      <Header view={view} setView={setView} session={session} theme={resolved} setTheme={setTheme}
              onSignIn={() => setAuth({})} onSignOut={signOut}
              openWire={() => setShowWire(true)} wireCount={wireCount} />

      {view.name === "browse" && (
        <>
          {!loadingEvents && featured && (
            <Hero event={featured} queue={queues[featured.id] || 0} totals={totals}
                  onOpen={setOpen}
                  onBrowse={() => document.getElementById("browse").scrollIntoView({ behavior: "smooth", block: "start" })} />
          )}
          <div id="browse">
            <Browse events={events} loading={loadingEvents} criteria={criteria} setCriteria={setCriteria}
                    queues={queues} onOpen={setOpen} onRush={rush} session={session} />
          </div>
        </>
      )}

      {view.name === "bookings" && session && (
        <MyBookings bookings={bookings} loading={loadingBookings} onCancel={doCancelBooking}
                    onOpenEvent={openEventById} busyId={busy} goBrowse={() => setView({ name: "browse" })} />
      )}

      {view.name === "organizer" && session && (
        <Organizer session={session} events={events} queues={queues} loading={loadingEvents}
                   onNew={() => { setFormErr(null); setForm({ event: null }); }}
                   onEdit={(e) => { setFormErr(null); setForm({ event: e }); }}
                   onCancelEvent={cancelEvent} onDelete={deleteEvent} onRoster={openRoster} busyId={busy} />
      )}

      <footer className="foot">
        <div className="wrap" style={{ display: "flex", justifyContent: "space-between", gap: 20, flexWrap: "wrap", width: "100%" }}>
          <span>EventHub — React front end for the Spring Boot API. Running on demo data in your browser.</span>
          <span>Seats are held with a row lock, so the last one can only be sold once.</span>
        </div>
      </footer>

      {open && (
        <EventDrawer event={open} queue={queues[open.id] || 0} myBooking={myBookingFor(open.id)}
                     session={session} busy={busy === "book"} onClose={() => setOpen(null)}
                     onBook={doBook} onCancelBooking={doCancelBooking} />
      )}
      {form && <EventForm initial={form.event} busy={busy === "form"} error={formErr}
                          onClose={() => setForm(null)} onSave={saveEvent} />}
      {roster && <Roster event={roster.event} rows={roster.rows} loading={roster.loading} onClose={() => setRoster(null)} />}
      {auth && <AuthDialog note={auth.note} onClose={() => setAuth(null)}
                           onDone={(res) => {
                             const u = db.users.find((x) => x.email === res.email);
                             setSession({ email: res.email, role: res.role, name: u ? u.name : res.email,
                                          accessToken: res.accessToken, refreshToken: res.refreshToken });
                             setAuth(null);
                             toast("Signed in as " + (u ? u.name : res.email), null, "good");
                           }} />}
      {showWire && <WireDrawer onClose={() => setShowWire(false)}
                               onReset={() => { resetDb(); setSession(null); setShowWire(false);
                                                loadEvents(); toast("Demo data reset", "Back to the seeded state.", null); }} />}
      <Toasts items={toasts} dismiss={dismiss} />
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

</body>
</html>
